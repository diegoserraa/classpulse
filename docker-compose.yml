name: ${COMPOSE_PROJECT_NAME:-classpulse-frontend-dev}

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-https://classpulse-dev.zdmsolutions.com.br/api}
    container_name: ${CONTAINER_NAME:-classpulse-frontend}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
