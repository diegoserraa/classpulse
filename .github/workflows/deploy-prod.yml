name: Deploy Prod

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Sincronizar com a pasta do app
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            "$GITHUB_WORKSPACE"/ /var/www/classpulse/prod/frontend

      - name: Build e subir container
        run: |
          cd /var/www/classpulse/prod/frontend
          docker compose up -d --build
